competitive_coding_challenges_resources_server:
  resources_servers:
    competitive_coding_challenges:
      entrypoint: app.py
      domain: other
competitive_coding_challenges_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: competitive_coding_challenges_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/competitive_coding_challenges/data/train.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: competitive_coding_challenges
          version: 0.0.1
          artifact_fpath: train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/competitive_coding_challenges/data/validation.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: competitive_coding_challenges
          version: 0.0.1
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/competitive_coding_challenges/data/example.jsonl
        num_repeats: 1
