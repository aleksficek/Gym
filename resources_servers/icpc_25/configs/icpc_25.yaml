icpc_25_resources_server:
  resources_servers:
    icpc_25:
      entrypoint: app.py
      domain: coding
      # On-policy distillation settings (optional)
      # NOTE: When enable_distillation is false, comment out teacher_model_server to avoid validation errors
      enable_distillation: false  # Set to true to enable teacher distillation
      # teacher_model_server:
      #   type: responses_api_models
      #   name: teacher_model  # Reference to your teacher model server
      # teacher_responses_create_params:
      #   input: []  # Will be populated with student input at runtime
      distillation_temperature: 1.0  # Temperature for KL->reward conversion
      max_distillation_reward: 0.5  # Maximum reward from distillation
icpc_25_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: icpc_25_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/icpc_25/data/train.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: icpc_25
          version: 0.0.1
          artifact_fpath: train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/icpc_25/data/validation.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: icpc_25
          version: 0.0.1
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/icpc_25/data/example.jsonl
        num_repeats: 1
